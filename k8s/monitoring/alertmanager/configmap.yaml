apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    # Pas de notification pour l'instant : les alertes restent visibles dans
    # Prometheus et Alertmanager. Pour activer Slack, ajouter slack_api_url
    # (via un Secret) et une slack_configs dans le receiver.
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'default'

    receivers:
      - name: 'default'
