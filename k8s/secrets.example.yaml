# Modèle — NE PAS commiter de vraies valeurs.
# Copier vers k8s/secrets.yaml (ignoré par git) puis remplacer les valeurs,
# ou créer le secret directement :
#   kubectl -n collab create secret generic collab-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=DATABASE_URL="postgresql://collabuser:<mot_de_passe>@postgres:5432/collab"
apiVersion: v1
kind: Secret
metadata:
  name: collab-secrets
  namespace: collab
type: Opaque
stringData:
  JWT_SECRET: "<générer avec: openssl rand -base64 48>"
  POSTGRES_PASSWORD: "<mot de passe postgres>"
  DATABASE_URL: "postgresql://collabuser:<mot de passe postgres>@postgres:5432/collab"
