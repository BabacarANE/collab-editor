name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_LC: babacarane/collab-editor  # déjà en minuscules ici

jobs:
  # ─── Job 1 : Lint + Type check ────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Sans client Prisma généré, tous les types Prisma valent any et le
      # typecheck ne détecte rien
      - name: Generate Prisma clients
        run: |
          pnpm --filter @collab/api exec prisma generate
          pnpm --filter @collab/persistence exec prisma generate

      - name: Type check API
        run: pnpm --filter @collab/api exec tsc --noEmit

      - name: Type check Collab
        run: pnpm --filter @collab/collab exec tsc --noEmit

      - name: Type check Persistence
        run: pnpm --filter @collab/persistence exec tsc --noEmit

      # tsc -b suit les références du tsconfig racine (tsc --noEmit seul
      # ne vérifie aucun fichier car il contient files: [])
      - name: Type check Frontend
        run: pnpm --filter frontend exec tsc -b

  # ─── Job 1b : Tests d'intégration API ─────────────────────────────────────
  test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: collabuser
          POSTGRES_PASSWORD: collabpass123
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabuser -d collab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://collabuser:collabpass123@localhost:5432/collab
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Migrate database
        run: |
          pnpm --filter @collab/api exec prisma generate
          pnpm --filter @collab/api exec prisma migrate deploy

      - name: Run API tests
        run: pnpm --filter @collab/api test

  # ─── Job 2 : Build Docker images ──────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.REPO_LC }}/api:latest,ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          no-cache: true

      - name: Build & push Collab image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/collab/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.REPO_LC }}/collab:latest,ghcr.io/${{ env.REPO_LC }}/collab:${{ github.sha }}
          no-cache: true

      - name: Build & push Persistence image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/persistence/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.REPO_LC }}/persistence:latest,ghcr.io/${{ env.REPO_LC }}/persistence:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.REPO_LC }}/frontend:latest,ghcr.io/${{ env.REPO_LC }}/frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://collab.local:8080
            VITE_COLLAB_URL=ws://collab.local:8080/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3 : Security scan ────────────────────────────────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest      
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Scan API image    # ← plus besoin du step REPO_LC, déjà en env global
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH